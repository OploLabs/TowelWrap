<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Towels Wrap</title>

    <style>
      :root {
        --bg: #0d0f14;
        --panel: #151922;
        --panel-2: #1b202b;
        --border: #2b3240;

        --text: #f2f4f8;
        --muted: #8d96a8;

        --accent: #6c8cff;

        --transition: 0.12s;
      }

      * {
        box-sizing: border-box;
        scrollbar-width: thin;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }

      body {
        min-height: 100vh;

        background: var(--bg);
        color: var(--text);

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        overflow-x: hidden;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* =========================
           SCREEN
           ========================= */

      .screen {
        width: 100%;
        min-height: 100vh;
      }

      /* =========================
           BUTTONS
           ========================= */

      .button {
        border: 1px solid var(--border);

        background: var(--panel);
        color: var(--text);

        border-radius: 10px;

        padding: 11px 17px;

        transition:
          background var(--transition),
          border-color var(--transition),
          transform var(--transition);
        display: block;
        text-decoration: none;
      }

      .button:hover {
        background: var(--panel-2);
        border-color: #3b4455;
      }

      .button:active {
        transform: scale(0.97);
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      .button.primary:hover {
        filter: brightness(1.08);
      }

      .button.large {
        width: 100%;
        padding: 14px 18px;
        font-size: 17px;
      }

      /* =========================
           MAIN MENU
           ========================= */

      #menuScreen {
        display: flex;

        align-items: center;
        justify-content: center;

        padding: 24px;
      }

      .menu {
        width: min(420px, 100%);

        text-align: center;
      }

      .logo {
        margin-bottom: 45px;
      }

      .logo h1 {
        margin: 0;

        font-size: clamp(42px, 10vw, 68px);

        letter-spacing: -3px;

        font-weight: 800;
      }

      .logo p {
        margin: 10px 0 0;

        color: var(--muted);

        font-size: 14px;
      }

      .menu-buttons {
        display: flex;

        flex-direction: column;

        gap: 10px;
      }

      .menu-buttons .button {
        width: 100%;
      }

      .menu-footer {
        margin-top: 30px;

        color: var(--muted);

        font-size: 12px;
      }

      /* =========================
           MOBILE
           ========================= */

      @media (max-width: 430px) {
        #menuScreen {
          padding: 18px;
        }

        .logo {
          margin-bottom: 35px;
        }

        .logo h1 {
          font-size: 43px;
        }
      }
    </style>
  </head>

  <body>
    <section class="screen" id="menuScreen">
      <div class="menu">
        <div class="logo">
          <h1>Towels Wrap</h1>

          <p>A simple two-player strategy game.</p>
        </div>

        <div class="menu-buttons">
          <a class="button primary large" href="setup"> Play </a>

          <a class="button large" href="howtoplay"> How to Play </a>

          <a class="button large" href="settings"> Settings </a>
        </div>
        <div class="menu-footer">Towels Wrap</div>
      </div>
    </section>
  </body>
</html>
