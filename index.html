<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Towels Wrap</title>
    <meta
      name="description"
      content="TowelWrap is a lightweight browser-based strategy game with local multiplayer, AI opponents, customizable boards, rules, time controls, themes, and more." />
    <meta name="robots" content="index, follow" />
    <style>
      :root {
        --bg: #0d0f14;
        --panel: #151922;
        --panel-2: #1b202b;
        --border: #2b3240;

        --text: #f2f4f8;
        --muted: #8d96a8;

        --accent: #6c8cff;

        --transition: 0.12s;
      }

      * {
        box-sizing: border-box;
        scrollbar-width: thin;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }

      body {
        min-height: 100vh;

        background: var(--bg);
        color: var(--text);

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        overflow-x: hidden;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* =========================
           SCREEN
           ========================= */

      .screen {
        width: 100%;
        min-height: 100vh;
      }

      /* =========================
           BUTTONS
           ========================= */

      .button {
        border: 1px solid var(--border);

        background: var(--panel);
        color: var(--text);

        border-radius: 10px;

        padding: 11px 17px;

        transition:
          background var(--transition),
          border-color var(--transition),
          transform var(--transition);
        display: block;
        text-decoration: none;
      }

      .button:hover {
        background: var(--panel-2);
        border-color: #3b4455;
      }

      .button:active {
        transform: scale(0.97);
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      .button.primary:hover {
        filter: brightness(1.08);
      }

      .button.large {
        width: 100%;
        padding: 14px 18px;
        font-size: 17px;
      }

      /* =========================
           GITHUB BUTTON
           ========================= */

      .github-button {
        position: fixed;

        top: 18px;
        right: 18px;

        display: flex;
        align-items: center;
        gap: 8px;

        padding: 8px 13px;

        background: var(--panel);
        color: var(--text);

        border: 1px solid var(--border);
        border-radius: 8px;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        transition:
          background var(--transition),
          border-color var(--transition),
          transform var(--transition);
      }

      .github-button:hover {
        background: var(--panel-2);
        border-color: #3b4455;
      }

      .github-button:active {
        transform: scale(0.96);
      }

      .github-icon {
        width: 18px;
        height: 18px;

        fill: currentColor;
      }

      /* =========================
           MAIN MENU
           ========================= */

      #menuScreen {
        display: flex;

        align-items: center;
        justify-content: center;

        padding: 24px;
      }

      .menu {
        width: min(420px, 100%);

        text-align: center;
      }

      .logo {
        margin-bottom: 45px;
      }

      .logo h1 {
        margin: 0;

        font-size: clamp(42px, 10vw, 68px);

        letter-spacing: -3px;

        font-weight: 800;
      }

      .logo p {
        margin: 10px 0 0;

        color: var(--muted);

        font-size: 14px;
      }

      .menu-buttons {
        display: flex;

        flex-direction: column;

        gap: 10px;
      }

      .menu-buttons .button {
        width: 100%;
      }

      .menu-footer {
        margin-top: 30px;

        color: var(--muted);

        font-size: 12px;
      }

      /* =========================
           MOBILE
           ========================= */

      @media (max-width: 430px) {
        #menuScreen {
          padding: 18px;
        }

        .logo {
          margin-bottom: 35px;
        }

        .logo h1 {
          font-size: 43px;
        }

        .github-button {
          top: 12px;
          right: 12px;

          padding: 8px;
        }

        .github-button span {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- GitHub -->
    <a
      class="github-button"
      href="https://github.com/OploLabs/TowelWrap"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="View Towels Wrap on GitHub">
      <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577
          0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756
          -1.089-.745.084-.73.084-.73 1.205.085 1.84 1.237 1.84 1.237
          1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.605
          -2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22
          -.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23
          .957-.266 1.983-.399 3.003-.404 1.02.005 2.046.138 3.003.404
          2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176
          .765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92
          .435.375.81 1.096.81 2.21 0 1.595-.015 2.875-.015 3.265
          0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12
          24 5.37 18.63 0 12 0z" />
      </svg>

      <span>GitHub</span>
    </a>

    <section class="screen" id="menuScreen">
      <div class="menu">
        <div class="logo">
          <h1>Towels Wrap</h1>

          <p>A simple two-player strategy game.</p>
        </div>

        <div class="menu-buttons">
          <a class="button primary large" href="setup">Play</a>
          <a class="button large" href="online">Online</a>
          <a class="button large" href="howtoplay">How to Play</a>
          <a class="button large" href="settings">Settings</a>
        </div>

        <div class="menu-footer">Towels Wrap</div>
      </div>
    </section>
  </body>
</html>
